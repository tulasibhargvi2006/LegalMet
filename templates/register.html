<!DOCTYPE html>
<html>
<head>
    <title>Register - LegalMet AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
    <div class="floating-shapes">
        <span></span><span></span><span></span>
    </div>
    <div class="auth-container">
        <div class="auth-card">
            <h1><i class="fas fa-balance-scale"></i> LegalMet AI</h1>
            <h2>Create Account</h2>
            {% with messages = get_flashed_messages() %}
              {% if messages %}
                <ul class="flash-messages">
                  {% for m in messages %}<li>{{ m }}</li>{% endfor %}
                </ul>
              {% endif %}
            {% endwith %}
            <form method="POST">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Full Name</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" name="full_name" placeholder="Enter your full name" required>
                    </div>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-phone-alt"></i> Phone Number</label>
                    <div class="input-wrapper">
                        <i class="fas fa-phone"></i>
                        <input type="text" name="phone" placeholder="Enter phone number" required>
                    </div>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-key"></i>
                        <input type="password" name="password" placeholder="Create a password" required>
                    </div>
                </div>
                <button type="submit" class="auth-btn"><i class="fas fa-user-plus"></i> Register</button>
            </form>
            <div class="auth-footer">
                Already have an account? <a href="{{ url_for('login') }}">Login</a>
            </div>
        </div>
    </div>
</body>
</html>
